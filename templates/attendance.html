{% extends 'base.html' %}{% block title %}Attendance{% endblock %}{% block content %}<div class="card"><h1>QR Attendance</h1><form method="post"><label>Active Session Code</label><input class="input" name="session_code" placeholder="Enter code" required><br><br><button class="btn">Mark Attendance</button></form></div><div class="grid">{% for s in active_sessions %}<div class="card"><h3>{{ s['subject'] }}</h3><p>Department: {{ s['department'] }}</p><p>Code: <b>{{ s['session_code'] }}</b></p><span class="pill">Active</span></div>{% else %}<div class="card"><p class="muted">No active sessions.</p></div>{% endfor %}</div>{% endblock %}
