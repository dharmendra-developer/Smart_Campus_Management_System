{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<div class="card" style="max-width:600px;margin:auto"><h1>Create Student Account</h1><form method="post"><label>Name</label><input class="input" name="name" required><label>Email</label><input class="input" type="email" name="email" required><label>Password</label><div class="password-field"><input class="input" id="register-password" type="password" name="password" minlength="6" required><button class="password-toggle" type="button" data-password-toggle aria-controls="register-password" aria-label="Show password" aria-pressed="false">Show</button></div><label>Department</label><select name="department" required>{% for d in departments %}<option>{{ d }}</option>{% endfor %}</select><br><br><button class="btn">Register</button></form></div>{% endblock %}
